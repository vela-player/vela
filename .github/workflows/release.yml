# Push a tag like v1.0.0 to publish: creates the GitHub release and updates the
# Homebrew tap. Needs a repository secret TAP_GITHUB_TOKEN with write access to
# technitish9123/homebrew-tap.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in the code
        run: |
          code=$(sed -n 's/^let version = "\(.*\)"/\1/p' Sources/vela/main.swift)
          test "v$code" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != code $code"; exit 1; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "vela ${GITHUB_REF_NAME#v}"

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          version=${GITHUB_REF_NAME#v}
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sha=$(curl -fsSL "$url" | shasum -a 256 | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/technitish9123/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/$version/" -e "s/@SHA256@/$sha/" packaging/homebrew/vela.rb > tap/Formula/vela.rb
          cd tap
          git config user.name "vela release bot"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/vela.rb
          git commit -m "vela $version"
          git push
